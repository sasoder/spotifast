<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotifast visual review</title>
<style>
  :root { --bg: #f5f6f8; --fg: #15181d; --muted: #6d737c; --line: #d7dadf; --on: #15181d; --on-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131313; --fg: #ededed; --muted: #8f8f8f; --line: #2a2a2a; --on: #ededed; --on-fg: #131313; } }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
  .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .group span { color: var(--muted); margin-right: 4px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: var(--on); }
  p.note { color: var(--muted); margin: 8px 0 12px; max-width: 72ch; }
  img { max-width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; }
  .name { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
</style>
</head>
<body>
<h1>Spotifast visual review</h1>
<div class="row">
  <div class="group" id="pr"><span>Change</span></div>
  <div class="group" id="look"><span>Theme</span><button data-v="dark">Dark</button><button data-v="light">Light</button></div>
  <div class="group" id="width"><span>Window</span><button data-v="1240">Normal</button><button data-v="760">Narrow</button></div>
  <div class="group" id="state"><span>Show</span></div>
</div>
<p class="note" id="note"></p>
<img id="shot" alt="">
<p class="name" id="name"></p>
<script>
const prs = {
  fix: {
    title: "Liked Songs honours Colour from album art",
    note: "Liked Songs with the album-art setting off. Before: the purple header stays. After: plain, like every other page. --demo-page liked.",
    states: [["before", "Before"], ["after", "After"]],
    file: (look, w, s) => `fix-${look}-${w}-${s}.png`,
  },
  scroll: {
    title: "--demo-scroll for demo shots",
    note: "The same page at rest and after --demo-scroll 240. Tooling only, nothing in the app changes.",
    states: [["rest", "At rest"], ["scrolled", "Scrolled 240"]],
    file: (look, w, s) => `scroll-${look}-${w}-${s}.png`,
  },
  tint: {
    title: "Palette tint, anchored to the hero",
    note: "Playlist page, album-art setting off, palette with tint (#00000040 dark, #1c1b180f light). Before: main, no wash. After: the wash at the top, gone once scrolled 240 points.",
    states: [["before", "Before"], ["after", "After"], ["after-scrolled", "After, scrolled"]],
    file: (look, w, s) => `tint-${look}-${w}-${s}.png`,
  },
};
const sel = { pr: "fix", look: "dark", width: "1240", state: "before" };
function buttons(id, items) {
  const g = document.getElementById(id);
  g.querySelectorAll("button").forEach(b => b.remove());
  for (const [v, label] of items) {
    const b = document.createElement("button");
    b.textContent = label; b.dataset.v = v; g.appendChild(b);
  }
}
buttons("pr", Object.entries(prs).map(([k, p]) => [k, p.title]));
function render() {
  const pr = prs[sel.pr];
  if (!pr.states.some(([v]) => v === sel.state)) sel.state = pr.states[0][0];
  buttons("state", pr.states);
  for (const id of ["pr", "look", "width", "state"]) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === sel[id])));
  }
  const file = pr.file(sel.look, sel.width, sel.state);
  const img = document.getElementById("shot");
  img.src = "shots/" + file;
  img.alt = `${pr.title}, ${sel.look}, ${sel.width} wide, ${sel.state}`;
  document.getElementById("name").textContent = file;
  document.getElementById("note").textContent = pr.note;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  sel[b.parentElement.id] = b.dataset.v; render();
});
render();
</script>
</body>
</html>
